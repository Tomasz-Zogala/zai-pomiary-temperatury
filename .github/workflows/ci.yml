name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend – testy integracyjne
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Testy (JUnit + Testcontainers z TimescaleDB)
        working-directory: backend
        run: mvn -B verify

  frontend:
    name: Frontend – build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalacja zależności
        working-directory: frontend
        run: npm ci
      - name: Build produkcyjny
        working-directory: frontend
        run: npx ng build --output-path=dist

  generator:
    name: Generator – kontrola składni
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile generator/generator.py generator/seed_demo.py generator/demo_live.py
